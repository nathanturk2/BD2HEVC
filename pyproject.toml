[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd2hevc"
dynamic = ["version"]
description = "Full-disc Blu-ray HEVC conversion while preserving menus, extras, audio, subtitles, and VLC-friendly playback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "BD2HEVC contributors" }
]
keywords = ["blu-ray", "bdmv", "hevc", "nvenc", "vlc", "libbluray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion"
]

[project.scripts]
bd2hevc = "bd2hevc_app.cli:main"

[project.urls]
Repository = "https://github.com/nathanturk2/BD2HEVC"
Issues = "https://github.com/nathanturk2/BD2HEVC/issues"

[project.gui-scripts]
bd2hevc-gui = "bd2hevc_app.gui:launch_gui"

[tool.setuptools]
py-modules = ["bd_to_uhdbd", "bd2hevc"]
packages = ["bd2hevc_app"]

[tool.setuptools.dynamic]
version = {attr = "bd2hevc_app.config.VERSION"}

[tool.setuptools.package-data]
bd2hevc_app = ["data/*", "resources/**/*"]
