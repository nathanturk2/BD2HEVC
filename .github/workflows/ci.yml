name: CI
on: [push, pull_request]
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate application state
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("BD2HEVC_STATE_DIR=" + str(Path(os.environ["RUNNER_TEMP"]) / "hevc-unit-state") + "\n")
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python tools/check-shared.py
      - run: python tools/check-provenance.py
      - run: python bd2hevc.py --help
  artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Isolate application state
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("BD2HEVC_STATE_DIR=" + str(Path(os.environ["RUNNER_TEMP"]) / "hevc-artifact-state") + "\n")
      - run: python -m pip install setuptools wheel pycdlib
      - run: python tools/build-release.py --require-clean
      - run: python tools/check-artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release-artifacts
          path: dist/
