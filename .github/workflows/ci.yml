name: CI
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    env:
      BD2HEVC_STATE_DIR: ${{ runner.temp }}/hevc-unit-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python tools/check-shared.py
      - run: python tools/check-provenance.py
      - run: python bd2hevc.py --help
  artifacts:
    runs-on: windows-latest
    env:
      BD2HEVC_STATE_DIR: ${{ runner.temp }}/hevc-artifact-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools wheel pycdlib
      - run: python tools/build-release.py --require-clean
      - run: python tools/check-artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release-artifacts
          path: dist/
